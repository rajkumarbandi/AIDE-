# AdventureWorks Table Registry
#
# Metadata-driven schema definitions for the Bronze ingestion framework
# (notebooks/01_development/01_bronze_ingestion.py).
#
# Onboarding a new AdventureWorks table = adding an entry here, not writing code.
# The notebook falls back to generic tab-delimited parsing + automatic type
# inference for any source file that has no entry below (see the notebook's
# `resolve_table_config` for the fallback behavior).
#
# Column names/types and delimiters below were verified directly against
# data/adventureworks/instawdb.sql (BULK INSERT FIELDTERMINATOR/ROWTERMINATOR
# clauses and CREATE TABLE column order) and against the actual bytes of each
# CSV — not assumed. Two verified deviations from a naive header-less read:
#
#   1. Person.csv is NOT comma/tab-delimited. Its BULK INSERT uses
#      FIELDTERMINATOR = '+|' and ROWTERMINATOR = '&|\n' (Microsoft's own
#      workaround for delimiter collisions with the free-text/XML columns in
#      that table). Spark's CSV reader only supports single-character
#      delimiters, so this table is parsed via a dedicated text-split path.
#   2. Several tables include computed columns (e.g. Customer.AccountNumber,
#      SalesOrderHeader.SalesOrderNumber/TotalDue) as literal data in the CSV,
#      even though those columns are SQL Server computed columns excluded
#      from a strict BULK INSERT. Column lists below reflect the columns as
#      they actually appear in the CSV (verified by field-count + value-shape
#      inspection), not a literal copy of the BULK INSERT's target column list.
#
# The remaining tables below (all except the original 6) were added by an automated
# pass that parses every CREATE TABLE + BULK INSERT clause in instawdb.sql and
# cross-checks the resulting column count against each CSV's actual first data line
# (same verification method as the two deviations above, applied at scale). A few
# real issues that check caught and fixed:
#   - "uniqueidentifier"-typed columns (e.g. rowguid) use an unbracketed SQL type in
#     instawdb.sql and were silently dropped by an early version of the parser,
#     undercounting every affected table by exactly one column.
#   - `smallmoney` columns (CommissionPct, DiscountPct, TaxRate, CostRate) were not
#     in the type map and fell back to "string"; added as decimal(10,4).
#   - Computed columns default to "string" (safe for the common case: string
#     concatenation, e.g. AccountNumber), but a few are actual arithmetic — see
#     PurchaseOrderDetail.line_total/stocked_qty, PurchaseOrderHeader.total_due, and
#     WorkOrder.stocked_qty below, verified individually against their SQL formulas.
#
# NOT included below: JobCandidate.csv and ProductReview.csv. Both have a free-text
# column (Resume XML / review Comments) containing real, unescaped embedded newlines
# with no quoting to mark field boundaries — true multi-line records. The current
# Bronze readers (a plain per-physical-line text split for the "+|" delimiter style,
# and Spark's CSV reader — whose multiLine mode only reassembles a field across lines
# when it's quoted) cannot correctly reconstruct these records as-is; registering them
# would silently produce corrupted rows rather than a load failure. Needs a targeted
# reader fix (reassemble on the real row-terminator sequence, not on every newline)
# before these two are safe to onboard.

